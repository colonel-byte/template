---
name: goreleaser

on:
  push:
    tags:
      - "*"

# Read only at the top so that a job has to ask for what it writes. See the job block
# below for what it needs and why.
permissions:
  contents: read

jobs:
  goreleaser:
    # - contents: write creates the release and uploads the archives
    # - id-token: write is the OIDC token the attestation is bound to
    # - attestations: write proves provenance of the built artifacts
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required, not a precaution: goreleaser reads the tag history to
      # work out the version and to build the changelog, and a shallow clone has neither.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The `sboms:` block shells out to syft, so it has to be on PATH before goreleaser runs.
      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Setup cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Setup golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASS }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}

      - name: Attest packages
        id: attest-packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Publish provenance with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest-packages.outputs.bundle-path }}" packages.intoto.jsonl
          gh release upload "${GITHUB_REF_NAME}" packages.intoto.jsonl --clobber

  #   containers:
  #     runs-on: ubuntu-latest
  #     strategy:
  #       fail-fast: false
  #       matrix:
  #         dockerfile:
  #           - containers/base/Dockerfile
  #     steps:
  #       - uses: actions/checkout@...
  #       - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

name: Flaky or failing test
description: A test that fails intermittently, or fails only in one environment.
title: "test: "
labels:
  - bug
  - test-flake
body:
  - type: dropdown
    id: suite
    attributes:
      label: Which suite
      description: The suites are separate Go packages, so a group can be selected by package path.
      # Keep this list in step with the packages under test/.
      options:
        - test/e2e/noncluster - commands that need no live infrastructure
        - test/e2e/cluster - the suite that needs Docker
        - Unit tests
    validations:
      required: true
  - type: input
    id: test
    attributes:
      label: Test or subtest name
      description: Subtests are named as sentences, and `go test` replaces spaces with underscores in a `-run` pattern.
      placeholder: TestSign/re-signing_requires_overwrite
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or mage target
      description: Anchor both elements of a `-run` pattern if several suite names share a prefix.
      placeholder: go test -mod=vendor -count=1 -v -run '^TestSign$' ./test/e2e/noncluster/...
    validations:
      required: true
  - type: input
    id: rate
    attributes:
      label: How often does it fail
      description: Failures out of total runs, so the next person knows how long to loop it for.
      placeholder: 2 of 20
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it fail
      options:
        - Locally only
        - In CI only
        - Both
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Failure output
      description: The assertion that failed and enough surrounding lines to place it. Attach the run's diagnostics artifact when the failure came from CI.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Suites that drive the built binary depend on which binary was under test. Give the commit instead if the binary predates the change.
      placeholder: 1da789cd
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS and architecture, plus the versions of anything the suite needs to bring its fixtures up.
      placeholder: |
        Host OS: Fedora 44, x86_64
        docker version: 28.1.1
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: A theory about the race, a test that has to run before it to trigger the failure, or a rebuild you forgot - the binary is not rebuilt by `go test`.

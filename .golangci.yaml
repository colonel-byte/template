version: "2"
formatters:
  enable:
    - goimports
    - gofmt
linters:
  default: none
  exclusions:
    paths:
      # The mage target files themselves are package main behind //go:build mage, which the
      # linter cannot build without mage's generated entry point. Everything under
      # magefiles/pkg/ is ordinary Go and is linted like the rest of the module.
      - magefiles/[^/]*\.go$
      - magefiles/core/
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unused
    - whitespace
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF1008"
    errcheck:
      check-type-assertions: true
      check-blank: true
      # TEMPLATE: this list is the house exemptions for functions whose error is never
      # actionable. Add to it rather than sprinkling `//nolint` - nolintlint is on and
      # requires a specific linter name, so a bare one fails.
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Fprintf
    govet:
      disable:
        - shadow
        - fieldalignment
        - unusedwrite
        - printf
      enable-all: true
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "disableStutteringCheck"
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - [] # allowlist
            - [] # blocklist
            - [{skipPackageNameChecks: true}] # options map
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    sloglint:
      no-mixed-args: true
      key-naming-case: camel
    testifylint:
      enable-all: true
